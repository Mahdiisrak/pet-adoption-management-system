services:
  database:
    image: gvenzl/oracle-xe:21-slim
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Copy .env.example to .env and set ORACLE_PASSWORD}
      APP_USER: PET_ADMIN
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?Copy .env.example to .env and set APP_USER_PASSWORD}
    ports:
      # 1521 is commonly already occupied by a local Oracle installation.
      - "1522:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./database:/workspace/database:ro
      - ./database/docker/00_prepare_user.sql:/container-entrypoint-initdb.d/00_prepare_user.sql:ro
      - ./database/docker/01_initialize.sh:/container-entrypoint-initdb.d/01_initialize.sh:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build:
      context: ./backend
    environment:
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:?Copy .env.example to .env and set JWT_SECRET}
      DB_USER: PET_ADMIN
      DB_PASSWORD: ${APP_USER_PASSWORD:?Copy .env.example to .env and set APP_USER_PASSWORD}
      DB_CONNECT_STRING: database:1521/XEPDB1
      DB_POOL_MIN: 1
      DB_POOL_MAX: 5
      DB_POOL_INCREMENT: 1
    ports:
      - "5000:5000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    ports:
      # Keep this separate from common local development servers on 8080.
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  oracle-data:
